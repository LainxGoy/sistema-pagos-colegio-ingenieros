<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de cuotas - prototipo SQA</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:780px;margin:40px auto;padding:0 20px;color:#142436;background:#f5f7fa}
    h1{margin-bottom:4px} .hint{color:#526275} .card{background:white;border:1px solid #d9e0e8;border-radius:10px;padding:20px;margin:18px 0}
    table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:10px;border-bottom:1px solid #e1e6ec} th{background:#edf2f7}
    button{background:#145fb2;color:white;border:0;border-radius:5px;padding:9px 12px;cursor:pointer;margin-right:6px} button.secondary{background:#687789}
    button:disabled{background:#aab3bd;cursor:default} .badge{font-weight:bold} .ok{color:#087b43} .bad{color:#a12828}
  </style>
</head>
<body>
  <h1>Control de cuotas</h1>
  <p class="hint">Prototipo académico con datos de ejemplo. No procesa pagos ni guarda comprobantes.</p>
  <section class="card" aria-labelledby="afiliado">
    <h2 id="afiliado">Afiliado de ejemplo</h2>
    <p>Nombre: Ana Pérez</p>
    <p>Habilitación: <span id="habilitacion" class="badge"></span></p>
    <table><thead><tr><th>Período</th><th>Importe</th><th>Vencimiento</th><th>Estado</th></tr></thead><tbody id="cuotas"></tbody></table>
  </section>
  <section class="card" aria-labelledby="solicitud">
    <h2 id="solicitud">Solicitud de pago de ejemplo</h2>
    <p>Cuota: octubre 2026 · Estado: <span id="pago" class="badge"></span></p>
    <button id="aprobar" type="button">Aprobar</button>
    <button id="rechazar" type="button" class="secondary">Rechazar</button>
    <button id="reiniciar" type="button" class="secondary">Reiniciar ejemplo</button>
    <p id="mensaje" role="status" aria-live="polite"></p>
  </section>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
